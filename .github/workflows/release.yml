name: Build release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify the release version
        run: |
          test "$RELEASE_TAG" = "v$(PYTHONPATH=src python3 -c 'from flowvy_motd import __version__; print(__version__)')"
      - name: Build and test
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests
          python3 scripts/build-release.py
          dist/flowvy-motd.pyz --version
      - name: Upload release files
        run: gh release upload "$RELEASE_TAG" dist/flowvy-motd.pyz dist/flowvy-motd.pyz.sha256
